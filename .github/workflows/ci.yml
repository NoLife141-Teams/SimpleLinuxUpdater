name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.filter.outputs.go }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker }}
      ssh_apt: ${{ steps.filter.outputs.ssh_apt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/**'
              - 'tools/**'
              - 'docker-entrypoint.sh'
              - 'Dockerfile'
              - 'templates/**'
              - 'static/**'
              - 'tests/**'
              - 'package*.json'
              - 'playwright.config.js'
              - '.github/dependabot.yml'
              - 'README.md'
              - 'AGENTS.md'
              - 'docs/**'
            e2e:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.js'
              - 'static/**'
              - 'templates/**'
              - 'tests/e2e/**'
              - 'tools/frontend/**'
              - 'tools/performance/dashboard-e2e.cjs'
              - '.github/workflows/**'
              - 'tools/ci/**'
            docker:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-entrypoint.sh'
              - 'templates/**'
              - 'static/**'
              - 'tools/ci/**'
              - '.github/workflows/**'
            ssh_apt:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'templates/**'
              - 'static/**'
              - 'tools/ci/ssh-apt/**'
              - '.github/workflows/**'

      - name: Verify canonical Go toolchain alignment
        run: tools/ci/verify-go-toolchain.sh

  test:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_COVERAGE_THRESHOLD: '73.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: race
            cmd: go test -race -count=1 ./...
          - name: cover
            cmd: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.cmd }}

      - name: Enforce coverage threshold
        if: matrix.name == 'cover'
        run: |
          tools/ci/check-coverage.sh

      - name: Retain coverage report
        if: always() && matrix.name == 'cover'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-coverage-${{ github.run_attempt }}
          path: coverage.out
          retention-days: 1

  quality:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run Go vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run actionlint
        run: actionlint

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run frontend unit tests
        run: npm run test:unit

  ui-e2e:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLU_E2E_OUTPUT_DIR: test-results
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build webserver
        run: go build -o webserver .

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set absolute Playwright browser directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install E2E dependencies
        run: npm ci

      - name: Configure APT network resilience
        run: tools/ci/configure-apt.sh

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run isolated Playwright E2E
        run: npm run test:e2e

      - name: Retain Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1

  docker-smoke:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker with multi-platform image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v28.0.4
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Set up QEMU for runtime verification
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container without publishing
        run: docker buildx build --platform linux/amd64,linux/arm64 --pull --no-cache-filter runtime --load -t slu-smoke:ci .
      - name: Verify startup, privileges and persistence
        run: |
          image="$(docker image inspect slu-smoke:ci --format '{{.Id}}')"
          docker_host="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          for platform in linux/amd64 linux/arm64; do
            tools/ci/docker-smoke.sh "$image" "$platform"
            python3 tools/ci/admin-recovery-smoke.py "$image" "$platform" --docker-host "$docker_host"
          done

      - name: Retain Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-docker-${{ github.run_attempt }}
          path: .tmp-smoke/diagnostics/
          retention-days: 1

  ssh-apt:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.ssh_apt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [debian13, ubuntu2404]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Test harness safety and cleanup
        run: python3 -m unittest discover -s tools/ci/ssh-apt -p 'test_*.py' -v
      - name: Qualify real SSH and APT on disposable targets
        run: python3 tools/ci/ssh-apt/run.py --distro '${{ matrix.distro }}' --output ssh-apt-evidence
      - name: Retain redacted qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-apt-${{ matrix.distro }}-${{ github.run_attempt }}
          path: |
            ssh-apt-evidence/report.json
            ssh-apt-evidence/app.log
          retention-days: 1

  ci-required:
    if: always()
    needs:
      - preflight
      - test
      - quality
      - frontend-quality
      - ui-e2e
      - docker-smoke
      - ssh-apt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify required CI results
        env:
          CHANGES_RESULT: ${{ needs.preflight.result }}
          GO_REQUIRED: ${{ github.event_name == 'push' || needs.preflight.outputs.go == 'true' }}
          E2E_REQUIRED: ${{ github.event_name == 'push' || needs.preflight.outputs.e2e == 'true' }}
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_QUALITY_RESULT: ${{ needs.frontend-quality.result }}
          DOCKER_REQUIRED: ${{ github.event_name == 'push' || needs.preflight.outputs.docker == 'true' }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
          UI_E2E_RESULT: ${{ needs.ui-e2e.result }}
          SSH_APT_REQUIRED: ${{ github.event_name == 'push' || needs.preflight.outputs.ssh_apt == 'true' }}
          SSH_APT_RESULT: ${{ needs.ssh-apt.result }}
        run: |
          printf '%s\n' \
            "preflight=$CHANGES_RESULT" \
            "go_required=$GO_REQUIRED" \
            "e2e_required=$E2E_REQUIRED" \
            "test=$TEST_RESULT" \
            "quality=$QUALITY_RESULT" \
            "frontend_quality=$FRONTEND_QUALITY_RESULT" \
            "ui_e2e=$UI_E2E_RESULT"

          test "$CHANGES_RESULT" = success
          test "$FRONTEND_QUALITY_RESULT" = success

          if [ "$GO_REQUIRED" = true ]; then
            test "$TEST_RESULT" = success
            test "$QUALITY_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
            test "$QUALITY_RESULT" = skipped
          fi

          if [ "$E2E_REQUIRED" = true ]; then
            test "$UI_E2E_RESULT" = success
          else
            test "$UI_E2E_RESULT" = skipped
          fi

          if [ "$DOCKER_REQUIRED" = true ]; then
            test "$DOCKER_RESULT" = success
          else
            test "$DOCKER_RESULT" = skipped
          fi

          if [ "$SSH_APT_REQUIRED" = true ]; then
            test "$SSH_APT_RESULT" = success
          else
            test "$SSH_APT_RESULT" = skipped
          fi
