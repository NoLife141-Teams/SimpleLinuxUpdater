name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.filter.outputs.go }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/**'
              - 'tools/**'
              - 'docker-entrypoint.sh'
              - 'Dockerfile'
              - 'templates/**'
              - 'static/**'
              - 'tests/**'
              - 'package*.json'
              - 'playwright.config.js'
              - '.github/dependabot.yml'
              - 'README.md'
              - 'AGENTS.md'
              - 'docs/**'
            e2e:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.js'
              - 'static/**'
              - 'templates/**'
              - 'tests/e2e/**'
              - '.github/workflows/**'
              - 'tools/ci/**'
            docker:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-entrypoint.sh'
              - 'templates/**'
              - 'static/**'
              - 'tools/ci/**'
              - '.github/workflows/**'

      - name: Verify canonical Go toolchain alignment
        run: tools/ci/verify-go-toolchain.sh

  test:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_COVERAGE_THRESHOLD: '73.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: race
            cmd: go test -race -count=1 ./...
          - name: cover
            cmd: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.cmd }}

      - name: Enforce coverage threshold
        if: matrix.name == 'cover'
        run: |
          tools/ci/check-coverage.sh

      - name: Retain coverage report
        if: always() && matrix.name == 'cover'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-${{ github.run_attempt }}
          path: coverage.out
          retention-days: 7

  quality:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run Go vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run actionlint
        run: actionlint

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run frontend unit tests
        run: npm run test:unit

  ui-e2e:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_WEBSERVER_COMMAND: 'mkdir -p .tmp-e2e && rm -f .tmp-e2e/servers.db && : > .tmp-e2e/known_hosts && DEBIAN_UPDATER_DB_PATH=.tmp-e2e/servers.db DEBIAN_UPDATER_KNOWN_HOSTS=.tmp-e2e/known_hosts ./webserver'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build webserver
        run: go build -o webserver .

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set absolute Playwright browser directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install E2E dependencies
        run: npm ci

      - name: Configure APT network resilience
        run: tools/ci/configure-apt.sh

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright auth E2E
        run: npm run test:e2e

      - name: Retain Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-smoke:
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker with multi-platform image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v28.0.4
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Set up QEMU for runtime verification
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build container without publishing
        run: docker buildx build --platform linux/amd64,linux/arm64 --pull --no-cache-filter runtime --load -t slu-smoke:ci .
      - name: Verify startup, privileges and persistence
        run: |
          image="$(docker image inspect slu-smoke:ci --format '{{.Id}}')"
          for platform in linux/amd64 linux/arm64; do
            tools/ci/docker-smoke.sh "$image" "$platform"
          done

      - name: Retain Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-docker-${{ github.run_attempt }}
          path: .tmp-smoke/diagnostics/
          retention-days: 7

  ci-required:
    if: always()
    needs:
      - preflight
      - test
      - quality
      - frontend-quality
      - ui-e2e
      - docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify required CI results
        env:
          CHANGES_RESULT: ${{ needs.preflight.result }}
          GO_REQUIRED: ${{ github.event_name == 'push' || needs.preflight.outputs.go == 'true' }}
          E2E_REQUIRED: ${{ github.event_name == 'push' || needs.preflight.outputs.e2e == 'true' }}
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_QUALITY_RESULT: ${{ needs.frontend-quality.result }}
          DOCKER_REQUIRED: ${{ github.event_name == 'push' || needs.preflight.outputs.docker == 'true' }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
          UI_E2E_RESULT: ${{ needs.ui-e2e.result }}
        run: |
          printf '%s\n' \
            "preflight=$CHANGES_RESULT" \
            "go_required=$GO_REQUIRED" \
            "e2e_required=$E2E_REQUIRED" \
            "test=$TEST_RESULT" \
            "quality=$QUALITY_RESULT" \
            "frontend_quality=$FRONTEND_QUALITY_RESULT" \
            "ui_e2e=$UI_E2E_RESULT"

          test "$CHANGES_RESULT" = success
          test "$FRONTEND_QUALITY_RESULT" = success

          if [ "$GO_REQUIRED" = true ]; then
            test "$TEST_RESULT" = success
            test "$QUALITY_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
            test "$QUALITY_RESULT" = skipped
          fi

          if [ "$E2E_REQUIRED" = true ]; then
            test "$UI_E2E_RESULT" = success
          else
            test "$UI_E2E_RESULT" = skipped
          fi

          if [ "$DOCKER_REQUIRED" = true ]; then
            test "$DOCKER_RESULT" = success
          else
            test "$DOCKER_RESULT" = skipped
          fi
