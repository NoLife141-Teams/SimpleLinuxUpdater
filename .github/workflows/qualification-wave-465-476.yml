name: Qualification wave 465-476 VM
on:
  push:
    branches: [codex/qualification-wave-465-476-20261027]
permissions:
  contents: read
concurrency:
  group: qualification-wave-465-476-vm
  cancel-in-progress: false
jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b27e5f2ce5e08d1f7aa19cc21b21f9e4dc7fad12
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Disposable runner prerequisites
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client
      - name: Verify official immutable cloud image
        run: |
          mkdir -p cloud evidence
          curl --fail --location --retry 2 --max-time 300 -o cloud/SHA256SUMS https://cloud-images.ubuntu.com/releases/noble/release-20261017/SHA256SUMS
          grep '^04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94 [*]ubuntu-24.04-server-cloudimg-amd64.img$' cloud/SHA256SUMS > cloud/selected.sha256
          curl --fail --location --retry 2 --max-time 600 -o cloud/ubuntu-24.04-server-cloudimg-amd64.img https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
          (cd cloud && sha256sum --check selected.sha256)
          cp cloud/selected.sha256 evidence/cloud-image.sha256
          git rev-parse HEAD > evidence/source-sha.txt
          sha256sum tools/ci/ssh-apt/vm-reboot.py > evidence/harness.sha256
      - name: Real systemd and controlled reboot
        env:
          GOMAXPROCS: '2'
        run: |
          python3 - <<'PYQUAL'
          from pathlib import Path
          import os, hashlib, json
          source = Path("tools/ci/ssh-apt/vm-reboot.py")
          original = source.read_text()
          old = "except OSError: time.sleep(.1)"
          new = 'except (OSError, AssertionError) as error:\n                if isinstance(error, AssertionError) and "HTTP 503" not in str(error): raise\n                time.sleep(.1)'
          assert original.count(old) == 1
          patched = original.replace(old, new)
          destination = Path(os.environ["RUNNER_TEMP"]) / "vm-reboot-qualification.py"
          destination.write_text(patched)
          Path("evidence/harness-patch.json").write_text(json.dumps({"reason":"Retry only startup maintenance HTTP 503 within existing 30-second readiness bound", "source_sha256":hashlib.sha256(original.encode()).hexdigest(), "qualification_sha256":hashlib.sha256(patched.encode()).hexdigest(), "old":old, "new":new}, indent=2))
          PYQUAL
          PYTHONPATH="$PWD/tools/ci/ssh-apt" python3 "$RUNNER_TEMP/vm-reboot-qualification.py" --image cloud/ubuntu-24.04-server-cloudimg-amd64.img --sha256 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94 --output evidence/vm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qualification-wave-465-476-vm
          path: evidence/
          retention-days: 1
