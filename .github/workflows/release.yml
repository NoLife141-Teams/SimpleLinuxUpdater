name: Release

on:
  workflow_run:
    workflows: ["Release Tag Signal"]
    types: [completed]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GO_COVERAGE_THRESHOLD: '73.0'
      PLAYWRIGHT_WEBSERVER_COMMAND: 'mkdir -p .tmp-e2e && rm -f .tmp-e2e/servers.db && : > .tmp-e2e/known_hosts && DEBIAN_UPDATER_DB_PATH=.tmp-e2e/servers.db DEBIAN_UPDATER_KNOWN_HOSTS=.tmp-e2e/known_hosts ./webserver'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify trusted release signal and main ancestry
        run: tools/release/verify-tag-on-main.sh

      - name: Preserve trusted validation and publication helpers
        run: cp -R tools "$RUNNER_TEMP/trusted-tools"

      - name: Check out verified release commit
        run: git checkout --detach "$RELEASE_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set absolute Playwright browser directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install release tooling
        run: |
          # Pin release-gate tooling so tagged releases are reproducible.
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install UI dependencies
        run: npm ci

      - name: Configure APT network resilience
        run: bash "$RUNNER_TEMP/trusted-tools/ci/configure-apt.sh"

      - name: Install Playwright browser and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: |
          tools/ci/verify-go-toolchain.sh
          go vet ./...
          staticcheck ./...
          govulncheck ./...
          actionlint
          go test -race -count=1 ./...
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          bash "$RUNNER_TEMP/trusted-tools/ci/check-coverage.sh"
          go build -o webserver .
          npm run test:unit
          npm audit --audit-level=moderate
          npm run test:e2e

      - name: Retain Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Retain coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-coverage-${{ github.run_attempt }}
          path: coverage.out
          retention-days: 7

      - name: Verify release metadata
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          ESCAPED_TAG="$(printf '%s' "$TAG" | sed 's/[][\\.^$*+?{}|()]/\\&/g')"
          ESCAPED_VERSION="$(printf '%s' "$VERSION" | sed 's/[][\\.^$*+?{}|()]/\\&/g')"
          echo "Tag: $TAG"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          grep -Eq "^Version: ${ESCAPED_TAG}$" README.md
          grep -Eq ">[[:space:]]*${ESCAPED_TAG}[[:space:]]*<" templates/index.html
          test -f CHANGELOG.md
          grep -Eq "^## \[${ESCAPED_TAG}\]" CHANGELOG.md
          for doc in README.md docs/installation.md docs/deployment.md docs/configuration.md; do
            grep -Eq "simplelinuxupdater:${ESCAPED_TAG}" "$doc"
            stale_doc_tags="$(grep -Eo 'simplelinuxupdater:v[0-9]+\.[0-9]+\.[0-9]+' "$doc" | grep -Fvx "simplelinuxupdater:${TAG}" || true)"
            if [ -n "$stale_doc_tags" ]; then
              echo "Found stale SimpleLinuxUpdater image tag in $doc:" >&2
              printf '%s\n' "$stale_doc_tags" >&2
              exit 1
            fi
          done
          stale_readme_versions="$(grep -Eo '^VERSION="[0-9]+\.[0-9]+\.[0-9]+"$' README.md | grep -Fvx "VERSION=\"${VERSION}\"" || true)"
          if [ -n "$stale_readme_versions" ]; then
            echo "Found stale README binary VERSION:" >&2
            printf '%s\n' "$stale_readme_versions" >&2
            exit 1
          fi
          grep -Eq "^VERSION=\"${ESCAPED_VERSION}\"$" README.md

  publish-release:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify trusted release signal and main ancestry
        run: tools/release/verify-tag-on-main.sh

      - name: Preserve trusted validation and publication helpers
        run: cp -R tools "$RUNNER_TEMP/trusted-tools"

      - name: Check out verified release commit
        run: git checkout --detach "$RELEASE_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build release archives
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          APP="SimpleLinuxUpdater_${VERSION}"
          mkdir -p dist

          for TARGET in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            GOOS="${TARGET%% *}"
            GOARCH="${TARGET##* }"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            BIN="webserver_${GOOS}_${GOARCH}${EXT}"
            PKG_DIR="dist/${APP}_${GOOS}_${GOARCH}"
            PKG_ROOT="${PKG_DIR}/${APP}"

            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "dist/${BIN}" .

            mkdir -p "$PKG_ROOT"
            cp "dist/${BIN}" "${PKG_ROOT}/webserver${EXT}"
            cp -r templates static "$PKG_ROOT/"
            if [ -d docs ]; then
              cp -r docs "$PKG_ROOT/"
            fi
            if [ -f .github/assets/ALSU-screens.gif ]; then
              mkdir -p "$PKG_ROOT/.github/assets"
              cp .github/assets/ALSU-screens.gif "$PKG_ROOT/.github/assets/"
            fi
            cp README.md LICENSE .env-template "$PKG_ROOT/"

            if [ "$GOOS" = "windows" ]; then
              (
                cd "$PKG_DIR"
                zip -qry "../${APP}_${GOOS}_${GOARCH}.zip" "$APP"
              )
            else
              tar -C "$PKG_DIR" -czf "dist/${APP}_${GOOS}_${GOARCH}.tar.gz" "$APP"
            fi
            rm -rf "$PKG_DIR" "dist/${BIN}"
          done

          (
            cd dist
            sha256sum ./*.tar.gz ./*.zip > checksums.txt
          )

      - name: Build release notes from CHANGELOG
        id: release_notes
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          NOTES_FILE="dist/release_notes.md"
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 {capture=1}
            capture && $0 ~ "^## \\[" && index($0, "## [" tag "]") != 1 {exit}
            capture {print}
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Failed to extract release notes for $TAG from CHANGELOG.md" >&2
            exit 1
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate archives
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/release-archive-diagnostics
        run: bash "$RUNNER_TEMP/trusted-tools/release/verify-archives.sh"

      - name: Refuse replacement of an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/trusted-tools/release/publication-policy.py" draft

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          draft: true
          make_latest: false
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Retain archive diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archives-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-archive-diagnostics/
          retention-days: 7

  publish-docker:
    needs: [release-gate, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify trusted release signal and main ancestry
        run: tools/release/verify-tag-on-main.sh

      - name: Preserve trusted validation and publication helpers
        run: cp -R tools "$RUNNER_TEMP/trusted-tools"

      - name: Check out verified release commit
        run: git checkout --detach "$RELEASE_SHA"

      - name: Compute image name
        id: image
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Plan publication before registry writes
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 "$RUNNER_TEMP/trusted-tools/release/publication-policy.py" plan

      - name: Set up Docker with multi-platform image store
        if: steps.publication.outputs.mode != 'complete'
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v28.0.4
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - name: Set up QEMU for runtime verification
        if: steps.publication.outputs.mode != 'complete'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        if: steps.publication.outputs.mode != 'complete'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.publication.outputs.mode != 'complete'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate image
        if: steps.publication.outputs.mode == 'build'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.publication.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Qualify digest and promote image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publication.outputs.digest || steps.build.outputs.digest }}
          DIAGNOSTICS_DIR: ${{ runner.temp }}/release-docker-diagnostics
        run: python3 "$RUNNER_TEMP/trusted-tools/release/publication-policy.py" publish

      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 "$RUNNER_TEMP/trusted-tools/release/publication-policy.py" finalize

      - name: Retain Docker qualification diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-docker-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-docker-diagnostics/
          retention-days: 7
