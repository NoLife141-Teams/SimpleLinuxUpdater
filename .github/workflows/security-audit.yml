name: Security Audit

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Audit Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
      - name: Audit npm dependencies
        if: success() || failure()
        run: |
          npm ci
          npm audit --audit-level=moderate

  resolve-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.distribution.outputs.image }}
      digest: ${{ steps.distribution.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve distributed latest once
        id: distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/publication-policy.py distributed

  container-packages:
    needs: resolve-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan distributed OS and Go packages
        env:
          IMAGE: ${{ needs.resolve-distribution.outputs.image }}
          DIGEST: ${{ needs.resolve-distribution.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          DIAGNOSTICS_DIR: ${{ runner.temp }}/security-diagnostics
        run: tools/ci/scan-image.sh "$IMAGE@$DIGEST" "$PLATFORM"
      - name: Retain scan diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-image-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-diagnostics/
          retention-days: 7
