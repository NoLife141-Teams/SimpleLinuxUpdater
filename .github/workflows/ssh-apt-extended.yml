name: Extended SSH and APT qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ssh-apt-extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Qualify source-generated Package Deferral guard and negative control
        timeout-minutes: 8
        run: python3 tools/ci/ssh-apt/deferrals-negative.py --distro '${{ matrix.distro }}' --output deferrals-evidence
      - name: Qualify disposable targets
        run: python3 tools/ci/ssh-apt/run.py --distro '${{ matrix.distro }}' --output ssh-apt-evidence
      - name: Retain redacted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-ssh-apt-${{ matrix.distro }}-${{ github.run_attempt }}
          path: |
            ssh-apt-evidence/report.json
            ssh-apt-evidence/app.log
            deferrals-evidence/report.json
            deferrals-evidence/negative.json
            deferrals-evidence/positive.json
          retention-days: 1
